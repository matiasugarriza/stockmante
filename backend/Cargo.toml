[package]
name = "stockmante-backend"
version = "0.1.0"
edition = "2021"
# Con src/bin/bootstrap.rs hay dos binarios; `cargo run` sin --bin debe levantar el servidor.
default-run = "stockmante-backend"

[dependencies]
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "rust_decimal"] }
serde = { version = "1", features = ["derive"] }
# 003: montos NUMERIC(12,2) como número JSON (serde-float), no string.
rust_decimal = { version = "1", features = ["serde-float"] }
serde_json = "1"
argon2 = "0.5"
rand = "0.9"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
async-trait = "0.1"
time = "0.3"
# Correo real de la contraseña temporal (T029): async sobre rustls, sin OpenSSL.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }

