[package]
name = "stockmante-backend"
version = "0.1.0"
edition = "2021"
# Con src/bin/bootstrap.rs hay dos binarios; `cargo run` sin --bin debe levantar el servidor.
default-run = "stockmante-backend"

[dependencies]
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
validator = { version = "0.19", features = ["derive"] }
argon2 = "0.5"
rand = "0.9"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
async-trait = "0.1"
time = "0.3"

[[test]]
name = "test_password"
path = "tests/unit/test_password.rs"

[[test]]
name = "test_apperror"
path = "tests/unit/test_apperror.rs"

[[test]]
name = "test_mail"
path = "tests/unit/test_mail.rs"

[[test]]
name = "test_auth_login"
path = "tests/unit/test_auth_login.rs"

[[test]]
name = "test_sesion_unica"
path = "tests/unit/test_sesion_unica.rs"

[[test]]
name = "test_cambio_password"
path = "tests/unit/test_cambio_password.rs"

[[test]]
name = "test_familia_rol"
path = "tests/unit/test_familia_rol.rs"

[[test]]
name = "test_usuarios_email"
path = "tests/unit/test_usuarios_email.rs"

[[test]]
name = "test_usuarios_alta"
path = "tests/unit/test_usuarios_alta.rs"

[[test]]
name = "test_ultimo_admin"
path = "tests/unit/test_ultimo_admin.rs"

[[test]]
name = "test_auth_http"
path = "tests/integration/test_auth_http.rs"

[[test]]
name = "test_usuarios_http"
path = "tests/integration/test_usuarios_http.rs"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
