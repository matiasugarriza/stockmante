<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
		<script>
			// Aplica el tema antes del primer pintado (spec 018, FR-080): evita el destello claro.
			// Mantiene la misma clave y semántica que $lib/tema/tema.ts.
			(function () {
				try {
					var guardado = window.localStorage.getItem('stockmante:tema');
					var oscuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
					var tema =
						guardado === 'light' || guardado === 'dark'
							? guardado
							: oscuro
								? 'dark'
								: 'light';
					document.documentElement.setAttribute('data-tema', tema);
					document.documentElement.style.colorScheme = tema;
				} catch (error) {
					document.documentElement.setAttribute('data-tema', 'light');
				}
			})();
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
